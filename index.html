<style>
:root{
  --ground:#F5F6F8; --surface:#FFFFFF; --surface-2:#EDEFF3;
  --ink:#191D24; --muted:#5F6B7C; --line:#D8DDE5;
  --accent:#20567F; --accent-soft:#E4EDF5;
  --crit:#A8200F; --crit-soft:#FBE9E6;
  --warn:#8A4B06; --warn-soft:#FCF0E2;
  --ok:#0A6340; --ok-soft:#E3F2EB;
  --shadow:0 1px 2px rgba(20,30,45,.08), 0 6px 18px rgba(20,30,45,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#12151A; --surface:#191D24; --surface-2:#222732;
    --ink:#E7EAEF; --muted:#94A0B2; --line:#303744;
    --accent:#77AEDC; --accent-soft:#1B2C3D;
    --crit:#F78C7C; --crit-soft:#33201D;
    --warn:#E9A13B; --warn-soft:#312614;
    --ok:#5FCB9B; --ok-soft:#162C24;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#12151A; --surface:#191D24; --surface-2:#222732;
  --ink:#E7EAEF; --muted:#94A0B2; --line:#303744;
  --accent:#77AEDC; --accent-soft:#1B2C3D;
  --crit:#F78C7C; --crit-soft:#33201D;
  --warn:#E9A13B; --warn-soft:#312614;
  --ok:#5FCB9B; --ok-soft:#162C24;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font:400 15px/1.55 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-inline:16px; padding-block:28px 56px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
h1{font-size:25px; font-weight:700; letter-spacing:-.015em; margin:0; text-wrap:balance}
.lede{color:var(--muted); margin:0; max-width:64ch}
.eyebrow{
  font:500 11px/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 8px;
}
header .priv{
  margin-top:12px; display:inline-flex; gap:8px; align-items:baseline;
  background:var(--ok-soft); color:var(--ok); border:1px solid color-mix(in srgb, var(--ok) 28%, transparent);
  border-radius:3px; padding:7px 11px; font-size:13px; font-weight:500;
}
.drop{
  border:1.5px dashed var(--line); border-radius:6px; background:var(--surface);
  padding:30px 22px; text-align:center; transition:border-color .15s, background .15s;
}
.drop.hot{border-color:var(--accent); background:var(--accent-soft)}
.drop p{margin:0 0 4px; font-weight:600}
.drop small{color:var(--muted); display:block; margin-bottom:16px}
.btn{
  font:inherit; font-weight:600; font-size:14px; cursor:pointer;
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  padding:9px 16px; border-radius:4px;
}
.btn.ghost{background:transparent; color:var(--accent)}
.btn:focus-visible, .drop:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.stat{background:var(--surface); padding:15px 17px}
.stat .k{font:500 11px/1 "IBM Plex Mono",monospace; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted)}
.stat .v{font-size:27px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:7px; line-height:1}
.stat.c .v{color:var(--crit)} .stat.w .v{color:var(--warn)} .stat.g .v{color:var(--ok)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow)}
.panel > h2{
  margin:0; padding:14px 18px; border-bottom:1px solid var(--line);
  font-size:15px; font-weight:600; display:flex; justify-content:space-between; gap:12px; align-items:baseline;
}
.panel > h2 span{font:400 13px/1 "IBM Plex Mono",monospace; color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top}
th{font:500 11px/1.3 "IBM Plex Mono",monospace; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); background:var(--surface-2); white-space:nowrap; position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
td.mono,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px}
td.num{text-align:right; font-variant-numeric:tabular-nums}
.sev{display:inline-block; font:500 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.07em;
  padding:4px 7px; border-radius:3px; white-space:nowrap}
.sev.k{background:var(--crit-soft); color:var(--crit)}
.sev.u{background:var(--warn-soft); color:var(--warn)}
tr.k td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.u td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.empty{padding:26px 18px; color:var(--muted); text-align:center}
footer{color:var(--muted); font-size:13px; border-top:1px solid var(--line); padding-top:16px}
footer code{font-family:"IBM Plex Mono",monospace; font-size:12px}
.langs{display:flex; gap:0; border:1px solid var(--line); border-radius:4px;
  overflow:hidden; align-self:flex-start; background:var(--surface)}
.langs button{font:500 12px/1 "IBM Plex Mono",monospace; letter-spacing:.06em;
  border:0; background:transparent; color:var(--muted); padding:7px 11px; cursor:pointer;
  border-right:1px solid var(--line)}
.langs button:last-child{border-right:0}
.langs button[aria-pressed="true"]{background:var(--accent); color:#fff}
.langs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.err{background:var(--crit-soft); color:var(--crit); border:1px solid var(--crit);
  border-radius:4px; padding:12px 14px; font-size:14px}

<script>
"use strict";

/* ====================== ZIP / XLSX bez knižnice ======================= */
const td = new TextDecoder(), te = new TextEncoder();

async function inflate(buf){
  const ds = new DecompressionStream("deflate-raw");
  const s = new Blob([buf]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function citajZip(ab){
  const u = new Uint8Array(ab), dv = new DataView(ab);
  let eocd = -1;
  for (let i = u.length - 22; i >= Math.max(0, u.length - 66000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Súbor nie je platný .xlsx (chýba ZIP záznam).");
  const pocet = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const von = {};
  for (let i = 0; i < pocet; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const metoda = dv.getUint16(p + 10, true);
    const compLen = dv.getUint32(p + 20, true);
    const nLen = dv.getUint16(p + 28, true);
    const eLen = dv.getUint16(p + 30, true);
    const cLen = dv.getUint16(p + 32, true);
    const lho  = dv.getUint32(p + 42, true);
    const meno = td.decode(u.subarray(p + 46, p + 46 + nLen));
    const lnLen = dv.getUint16(lho + 26, true), leLen = dv.getUint16(lho + 28, true);
    const dataOd = lho + 30 + lnLen + leLen;
    von[meno] = { metoda, data: u.subarray(dataOd, dataOd + compLen) };
    p += 46 + nLen + eLen + cLen;
  }
  const out = {};
  for (const [meno, z] of Object.entries(von)){
    out[meno] = z.metoda === 0 ? z.data : await inflate(z.data);
  }
  return out;
}

function stlpecNaIndex(ref){
  let n = 0;
  for (const ch of ref){
    const c = ch.charCodeAt(0);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

async function citajXlsx(ab){
  const z = await citajZip(ab);
  const dp = new DOMParser();

  let zdielane = [];
  const ss = z["xl/sharedStrings.xml"];
  if (ss){
    const d = dp.parseFromString(td.decode(ss), "application/xml");
    zdielane = [...d.getElementsByTagName("si")].map(si =>
      [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  }

  let cesta = Object.keys(z).find(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k));
  if (!cesta) throw new Error("V súbore nie je žiadny hárok.");
  const d = dp.parseFromString(td.decode(z[cesta]), "application/xml");

  const riadky = [];
  for (const r of d.getElementsByTagName("row")){
    const bunky = [];
    for (const c of r.getElementsByTagName("c")){
      const i = stlpecNaIndex(c.getAttribute("r") || "A1");
      const t = c.getAttribute("t");
      let v;
      if (t === "inlineStr"){
        v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      } else {
        const vn = c.getElementsByTagName("v")[0];
        v = vn ? vn.textContent : null;
        if (t === "s" && v !== null) v = zdielane[+v] ?? "";
        else if (v !== null && t !== "str") { const n = Number(v); v = isNaN(n) ? v : n; }
      }
      if (i >= 0) bunky[i] = (v === undefined ? null : v);
    }
    riadky.push(bunky);
  }
  while (riadky.length && !(riadky[riadky.length-1]||[]).some(x => x !== null && x !== undefined && x !== ""))
    riadky.pop();
  return riadky;
}

/* --- zápis .xlsx: ZIP bez kompresie (STORE) + inline reťazce --- */
const CRC = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF;
  for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; }

function zipuj(subory){
  const chunks = [], centr = []; let posun = 0;
  const now = new Date();
  const cas = ((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)) & 0xFFFF;
  const dat = (((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate()) & 0xFFFF;
  for (const [meno, text] of subory){
    const n = te.encode(meno), d = te.encode(text), c = crc32(d);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, cas, true); lh.setUint16(12, dat, true);
    lh.setUint32(14, c, true); lh.setUint32(18, d.length, true);
    lh.setUint32(22, d.length, true); lh.setUint16(26, n.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), n, d);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true); cd.setUint16(8, 0, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, cas, true); cd.setUint16(14, dat, true);
    cd.setUint32(16, c, true); cd.setUint32(20, d.length, true);
    cd.setUint32(24, d.length, true); cd.setUint16(28, n.length, true);
    cd.setUint32(42, posun, true);
    centr.push(new Uint8Array(cd.buffer), n);
    posun += 30 + n.length + d.length;
  }
  const cdZac = posun;
  let cdDlzka = 0; for (const c of centr) cdDlzka += c.length;
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, subory.length, true); e.setUint16(10, subory.length, true);
  e.setUint32(12, cdDlzka, true); e.setUint32(16, cdZac, true);
  return new Blob([...chunks, ...centr, new Uint8Array(e.buffer)],
    { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pismenoStlpca(i){ let s = "";
  for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s; }

function urobXlsx(hlavicka, riadky){
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  const vsetky = [hlavicka, ...riadky];
  vsetky.forEach((r, ri) => {
    xml += `<row r="${ri+1}">`;
    r.forEach((v, ci) => {
      if (v === null || v === undefined || v === "") return;
      const ref = pismenoStlpca(ci) + (ri + 1);
      if (typeof v === "number" && isFinite(v)) xml += `<c r="${ref}"><v>${v}</v></c>`;
      else xml += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    });
    xml += "</row>";
  });
  xml += "</sheetData></worksheet>";

  return zipuj([
    ["[Content_Types].xml",
     '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
     + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
     + '<Default Extension="xml" ContentType="application/xml"/>'
     + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
     + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
     + '</Types>'],
    ["_rels/.rels",
     '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
     + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
     + '</Relationships>'],
    ["xl/workbook.xml",
     '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
     + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
     + '<sheets><sheet name="Data" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ["xl/_rels/workbook.xml.rels",
     '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
     + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
     + '</Relationships>'],
    ["xl/worksheets/sheet1.xml", xml],
  ]);
}

let jazyk = "sk";
function t(k, p){
  const s = (L[jazyk] && L[jazyk][k] !== undefined) ? L[jazyk][k] : (L.sk[k] ?? k);
  return (p && typeof s === "string") ? s.replace(/\{(\w+)\}/g, (_, x) => p[x]) : s;
}

/* ========================== číselníky a kontroly ====================== */
const MJ_MAP = { ks:"ST", "ks.":"ST", kus:"ST", kusy:"ST", pcs:"ST", pc:"ST", st:"ST", ea:"ST",
  stk:"ST", "stück":"ST", stueck:"ST",
  bal:"KAR", balenie:"KAR", kar:"KAR", "kartón":"KAR", karton:"KAR",
  sada:"SET", set:"SET", m:"M", meter:"M", bm:"M", mm:"MM", cm:"CM",
  kg:"KG", g:"G", t:"TO", to:"TO", l:"L", ml:"ML", m2:"M2", m3:"M3", vrece:"VRE" };
const MJ_PLATNE = new Set(["ST","KAR","SET","M","MM","CM","KG","G","TO","L","ML","M2","M3","VRE"]);
const MTART_PLATNE = new Set(["ROH","HALB","FERT","HAWA","DIEN","VERP","HIBE","NLAG","UNBW","ERSA"]);
const DPH_PLATNE = new Set([0,10,20,23]);
const MAKTX_MAX = 40;

const POLIA = {
  kluc:    ["matnr","material","materiál","materialnummer","materialnr","matnr.",
            "číslo materiálu","cislo materialu","material number","material no",
            "kód","kod","code","kód produktu","kod produktu","sku","item","artikel","artikelnummer"],
  nazov:   ["maktx","názov","nazov","popis","description","text","názov produktu","nazov produktu",
            "material description","materialkurztext","kurztext","bezeichnung","materialbezeichnung",
            "short text","description of material"],
  mj:      ["meins","mj","merná jednotka","merna jednotka","jednotka","uom","unit",
            "base unit","base unit of measure","basismengeneinheit","mengeneinheit","basis-me","me"],
  mtart:   ["mtart","typ materiálu","typ materialu","material type","druh materiálu","materialart","art"],
  matkl:   ["matkl","skupina materiálu","skupina materialu","material group","kategória","kategoria",
            "category","warengruppe","materialgruppe"],
  ean:     ["ean11","ean","ean13","ean/upc","čiarový kód","ciarovy kod","barcode","gtin","strichcode"],
  brgew:   ["brgew","hrubá hmotnosť","hruba hmotnost","gross weight","hmotnosť","hmotnost","weight",
            "bruttogewicht","gewicht"],
  ntgew:   ["ntgew","čistá hmotnosť","cista hmotnost","net weight","nettogewicht"],
  gewei:   ["gewei","jednotka hmotnosti","weight unit","gewichtseinheit"],
  werks:   ["werks","závod","zavod","plant","werk","prevádzka"],
  cena:    ["cena","price","cena bez dph","stprs","verpr","netto cena","preis","standardpreis",
            "moving average price","standard price"],
  dph:     ["dph","sadzba dph","vat","tax","mwst","steuer","vat rate","tax rate"],
  dodavatel:["lifnr","dodávateľ","dodavatel","supplier","vendor","kód dodávateľa","kod dodavatela",
            "lieferant","lieferantennummer","vendor number"],
};
const PORADIE = ["kluc","nazov","mtart","mj","matkl","ean","brgew","ntgew","gewei","werks","cena","dph","dodavatel"];

function mapujHlavicku(h){
  const map = {}, pouzite = new Set();
  h.forEach((n, i) => {
    const x = String(n ?? "").trim().toLowerCase();
    if (!x) return;
    for (const [pole, v] of Object.entries(POLIA)){
      if (pouzite.has(pole)) continue;
      if (v.includes(x)){ map[pole] = i; pouzite.add(pole); return; }
    }
  });
  return map;
}
function ean13ok(e){
  if (!/^\d{13}$/.test(e)) return false;
  let s = 0; for (let i = 0; i < 12; i++) s += (+e[i]) * (i % 2 === 0 ? 1 : 3);
  return (10 - s % 10) % 10 === +e[12];
}
function naCislo(v){
  if (v === null || v === undefined || (typeof v === "string" && !v.trim())) return [null, true];
  if (typeof v === "number") return [v, false];
  let x = String(v).trim().replace(/[^\d,.\-]/g, "").replace(/,/g, ".").replace(/\.(?=.*\.)/g, "");
  const n = Number(x);
  return isNaN(n) ? [null, true] : [n, true];
}
const klucNazvu = s => String(s).toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "");

const KRIT = "K", UPOZ = "U";

function skontroluj(riadky){
  if (!riadky.length) throw new Error(t("e_prazdny"));
  const hlavicka = riadky[0].map(x => x ?? "");
  const m = mapujHlavicku(hlavicka);
  if (m.kluc === undefined) throw new Error(t("e_kluc"));

  const N = [], ciste = [], videneKluce = new Map(), videneNazvy = new Map();
  const cit = (r, p) => m[p] === undefined ? null : (r[m[p]] ?? null);
  const hl = p => m[p] === undefined ? p : String(hlavicka[m[p]]);
  const nalez = (r, k, pole, zav, tk, tp, pov, ak, ap) =>
    N.push({ riadok:r, kluc:k, pole, zav, tk, tp, pov, ak, ap });
  const PRAZDNE = "\u0000prazdne";

  for (let i = 1; i < riadky.length; i++){
    const r = riadky[i], c = i + 1;
    if (!r || !r.some(x => x !== null && x !== undefined && x !== "")) continue;
    let blok = false;

    const kRaw = cit(r,"kluc") === null ? "" : String(cit(r,"kluc"));
    const k = kRaw.trim().toUpperCase();
    if (!k){ nalez(c,"",hl("kluc"),KRIT,"t_chybajuce",null,PRAZDNE,"a_von",null); blok = true; }
    else if (k !== kRaw) nalez(c,k,hl("kluc"),UPOZ,"t_nekonz_kluc",null,JSON.stringify(kRaw),"a_norm",{v:k});

    const nRaw = cit(r,"nazov") === null ? "" : String(cit(r,"nazov"));
    const n = nRaw.replace(/\s+/g," ").trim();
    if (m.nazov !== undefined){
      if (!n){ nalez(c,k,hl("nazov"),KRIT,"t_chybajuce",null,PRAZDNE,"a_von",null); blok = true; }
      else {
        if (n !== nRaw) nalez(c,k,hl("nazov"),UPOZ,"t_medzery",null,JSON.stringify(nRaw),"a_uprav",{v:n});
        if (n.length > MAKTX_MAX)
          nalez(c,k,hl("nazov"),KRIT,"t_dlhy",{n:n.length,max:MAKTX_MAX},n,"a_skratit",null);
      }
    }

    let mj = null;
    if (m.mj !== undefined){
      const raw = cit(r,"mj") === null ? "" : String(cit(r,"mj")).trim();
      mj = MJ_MAP[raw.toLowerCase()] ?? raw.toUpperCase();
      if (!raw){ nalez(c,k,hl("mj"),KRIT,"t_chybajuce",null,PRAZDNE,"a_von",null); blok = true; }
      else if (mj !== raw.toUpperCase()) nalez(c,k,hl("mj"),UPOZ,"t_mj_nekonz",null,raw,"a_zjedn",{v:mj});
      else if (!MJ_PLATNE.has(mj)){ nalez(c,k,hl("mj"),KRIT,"t_mj_nezn",null,mj,"a_von",null); blok = true; }
    }

    let mtart = null;
    if (m.mtart !== undefined){
      const raw = cit(r,"mtart") === null ? "" : String(cit(r,"mtart")).trim().toUpperCase();
      mtart = raw;
      if (!raw){ nalez(c,k,hl("mtart"),KRIT,"t_mtart_chyba",null,PRAZDNE,"a_von",null); blok = true; }
      else if (!MTART_PLATNE.has(raw)){ nalez(c,k,hl("mtart"),KRIT,"t_mtart_nezn",null,raw,"a_von",null); blok = true; }
    }

    let ean = null;
    if (m.ean !== undefined){
      const raw = cit(r,"ean") === null ? "" : String(cit(r,"ean")).trim();
      ean = raw.replace(/\s+/g,"");
      if (!ean) nalez(c,k,hl("ean"),UPOZ,"t_ean_chyba",null,PRAZDNE,"a_ean_dopl",null);
      else if (!/^\d+$/.test(ean)) nalez(c,k,hl("ean"),KRIT,"t_ean_nenum",null,raw,"a_overit",null);
      else if (ean.length !== 13) nalez(c,k,hl("ean"),KRIT,"t_ean_dlzka",{n:ean.length},ean,"a_overit",null);
      else if (!ean13ok(ean)) nalez(c,k,hl("ean"),KRIT,"t_ean_sucet",null,ean,"a_overit_dod",null);
      else if (ean !== raw) nalez(c,k,hl("ean"),UPOZ,"t_ean_medzery",null,JSON.stringify(raw),"a_ocist",{v:ean});
    }

    let brgew = null, ntgew = null;
    if (m.brgew !== undefined){
      const [v, opr] = naCislo(cit(r,"brgew")); brgew = v;
      if (v === null) nalez(c,k,hl("brgew"),UPOZ,"t_hm_chyba",null,PRAZDNE,"a_prazdne",null);
      else if (opr) nalez(c,k,hl("brgew"),UPOZ,"t_hm_format",null,String(cit(r,"brgew")),"a_preved",{v});
      if (v !== null && v < 0){ nalez(c,k,hl("brgew"),KRIT,"t_hm_zap",null,String(v),"a_von",null); blok = true; }
    }
    if (m.ntgew !== undefined){
      const [v] = naCislo(cit(r,"ntgew")); ntgew = v;
      if (v !== null && brgew !== null && v > brgew){
        nalez(c,k,hl("ntgew"),KRIT,"t_ntgew",null,`${v} > ${brgew}`,"a_von",null); blok = true; }
    }

    let cena = null, dph = null;
    if (m.cena !== undefined){
      const [v, opr] = naCislo(cit(r,"cena")); cena = v;
      if (v === null){ nalez(c,k,hl("cena"),KRIT,"t_cena_chyba",null,String(cit(r,"cena")),"a_von",null); blok = true; }
      else {
        if (opr) nalez(c,k,hl("cena"),UPOZ,"t_cena_format",null,String(cit(r,"cena")),"a_preved",{v:v.toFixed(2)});
        if (v < 0){ nalez(c,k,hl("cena"),KRIT,"t_cena_zap",null,v.toFixed(2),"a_von",null); blok = true; }
        else if (v === 0){ nalez(c,k,hl("cena"),KRIT,"t_cena_nula",null,"0.00","a_von",null); blok = true; }
      }
    }
    if (m.dph !== undefined){
      let [v, opr] = naCislo(cit(r,"dph"));
      if (v !== null && v > 0 && v < 1){ v *= 100; opr = true; }
      dph = v;
      if (v === null){ nalez(c,k,hl("dph"),KRIT,"t_dph_chyba",null,String(cit(r,"dph")),"a_von",null); blok = true; }
      else {
        if (opr) nalez(c,k,hl("dph"),UPOZ,"t_dph_format",null,String(cit(r,"dph")),"a_preved",{v:Math.round(v)});
        if (!DPH_PLATNE.has(Math.round(v))){ nalez(c,k,hl("dph"),KRIT,"t_dph_nepl",null,String(Math.round(v)),"a_von",null); blok = true; }
      }
    }

    if (k){
      if (videneKluce.has(k)){ nalez(c,k,hl("kluc"),KRIT,"t_dup",null,k,"a_dup",{r:videneKluce.get(k)}); blok = true; }
      else videneKluce.set(k, c);
    }
    if (n){
      const kn = klucNazvu(n);
      if (videneNazvy.has(kn) && !blok)
        nalez(c,k,hl("nazov"),UPOZ,"t_podobny",null,n,"a_over_dup",{r:videneNazvy.get(kn)});
      else if (!videneNazvy.has(kn)) videneNazvy.set(kn, c);
    }

    if (!blok){
      const out = [];
      for (const pole of PORADIE) if (m[pole] !== undefined) out.push(hodnota(pole));
      ciste.push(out);
    }
    function hodnota(p){
      switch(p){
        case "kluc": return k; case "nazov": return n; case "mj": return mj;
        case "mtart": return mtart; case "ean": return ean || null;
        case "brgew": return brgew; case "ntgew": return ntgew;
        case "cena": return cena === null ? null : Math.round(cena*100)/100;
        case "dph": return dph === null ? null : Math.round(dph);
        default: { const v = cit(r, p); return v === null ? null : String(v).trim(); }
      }
    }
  }
  const hlavickaCista = PORADIE.filter(p => m[p] !== undefined).map(p => String(hlavicka[m[p]]));
  return { hlavickaCista, ciste, nalezy:N, poctet: riadky.length - 1, mapovane:Object.keys(m) };
}

  $("#privB").textContent = t("priv_b");
  $("#privT").textContent = " " + t("priv");
  $("#dropTxt").textContent = t("drop");
  $("#alebo").textContent = t("alebo");
  $("#pick").textContent = t("pick");
  $("#demo").textContent = t("demo");
  $("#stiahniCiste").textContent = t("dl_ciste");
  $("#stiahniProtokol").textContent = t("dl_prot");
  $("#hProt").firstChild.nodeValue = t("h_prot") + " ";
  $("#fKontroly").textContent = t("f_kontroly");
  $("#fHlavicky").textContent = t("f_hlavicky");
  document.querySelectorAll("#tabNalezy thead th").forEach((th, i) => th.textContent = t("th")[i]);
  document.querySelectorAll("#jazyky button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.j === jazyk)));
}

function ukazChybu(txt){ const e = $("#chyba"); e.textContent = txt; e.hidden = false; $("#vysledok").hidden = true; }

function vykresli(v){
  posledne = v; poslednaChyba = null;
  $("#chyba").hidden = true;
  const krit = v.nalezy.filter(n => n.zav === KRIT).length;
  $("#stats").innerHTML = [
    ["s_vstup", v.poctet, ""], ["s_ciste", v.ciste.length, "g"],
    ["s_nalezy", v.nalezy.length, ""], ["s_krit", krit, "c"],
    ["s_upoz", v.nalezy.length - krit, "w"],
  ].map(([k, val, cls]) =>
    `<div class="stat ${cls}"><div class="k">${esc(t(k))}</div><div class="v">${val}</div></div>`).join("");

  $("#pocetNalezov").textContent = v.nalezy.length
    ? t("n_spolu", { n:v.nalezy.length, k:krit }) : t("bez_nalezov");

  const tb = $("#tabNalezy tbody");
  if (!v.nalezy.length){
    tb.innerHTML = `<tr><td colspan="7" class="empty">${esc(t("ok"))}</td></tr>`;
  } else {
    const z = [...v.nalezy].sort((a,b) => a.zav === b.zav ? a.riadok - b.riadok : (a.zav === KRIT ? -1 : 1));
    tb.innerHTML = z.map(n => {
      const kr = n.zav === KRIT;
      return `<tr class="${kr?"k":"u"}">
      <td><span class="sev ${kr?"k":"u"}">${esc(t(kr?"KRIT":"UPOZ"))}</span></td>
      <td class="num mono">${n.riadok}</td>
      <td class="mono">${esc(n.kluc || "—")}</td>
      <td>${esc(n.pole)}</td>
      <td>${esc(t(n.tk, n.tp))}</td>
      <td class="mono">${esc(zobrazPov(n.pov))}</td>
      <td>${esc(t(n.ak, n.ap))}</td></tr>`; }).join("");
  }
  $("#vysledok").hidden = false;
}

function stiahni(blob, meno){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = meno;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function spracujSubor(f){
  try { vykresli(skontroluj(await citajXlsx(await f.arrayBuffer()))); }
  catch(e){ poslednaChyba = e.message; ukazChybu(t("chyba", { e:e.message })); }
}
function nacitajUkazku(){
  try { vykresli(skontroluj(UKAZKA.map(r => r.slice()))); }
  catch(e){ poslednaChyba = e.message; ukazChybu(t("chyba", { e:e.message })); }
}

$("#pick").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => { if (e.target.files[0]) spracujSubor(e.target.files[0]); });
$("#demo").addEventListener("click", nacitajUkazku);
const drop = $("#drop");
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); $("#file").click(); }});
["dragenter","dragover"].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.add("hot"); }));
["dragleave","drop"].forEach(x => drop.addEventListener(x, e => { e.preventDefault(); drop.classList.remove("hot"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) spracujSubor(f); });

$("#stiahniCiste").addEventListener("click", () => {
  if (posledne) stiahni(urobXlsx(posledne.hlavickaCista, posledne.ciste), "clean_import.xlsx");
});
$("#stiahniProtokol").addEventListener("click", () => {
  if (!posledne) return;
  const h = t("th");
  const r = posledne.nalezy.map(n => [ t(n.zav === KRIT ? "KRIT" : "UPOZ"), n.riadok, n.kluc,
    n.pole, t(n.tk, n.tp), zobrazPov(n.pov), t(n.ak, n.ap) ]);
  stiahni(urobXlsx(h, r), "findings_log.xlsx");
});

$("#jazyky").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  jazyk = b.dataset.j;
  try { localStorage.setItem("mdcheck_jazyk", jazyk); } catch(_){}
  prelozStatiku();
  if (posledne) vykresli(posledne);
  else if (poslednaChyba) ukazChybu(t("chyba", { e:poslednaChyba }));
});

/* štart: uložená voľba, inak jazyk prehliadača, inak slovenčina */
(function(){
  let j = null;
  try { j = localStorage.getItem("mdcheck_jazyk"); } catch(_){}
  if (!j){ const n = (navigator.language || "sk").slice(0,2).toLowerCase();
           j = ["sk","en","de"].includes(n) ? n : (n === "cs" ? "sk" : "en"); }
  jazyk = L[j] ? j : "sk";
  prelozStatiku();
  nacitajUkazku();
})();
</script></body></html>
